name: Android CI / CD

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build & Distribute Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          yarn install --ignore-engines

      - name: Configure Environment Variables
        run: |
          echo "GOOGLE_MAPS_API_KEY=dummy_key_for_ci" > .env

      - name: Setup Android Keystore
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 -d > android/app/gigpay-release-key.keystore
          cat <<EOF > android/key.properties
          storeFile=gigpay-release-key.keystore
          keyAlias=$KEY_ALIAS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          EOF

      - name: Setup Firebase Service Account
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" | tr -d '\n\r' | base64 -d > firebase-service-account.json

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gigpay-android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Distribute to Firebase App Distribution
        if: ${{ env.FIREBASE_APP_ID != '' && (env.FIREBASE_SERVICE_ACCOUNT != '' || env.FIREBASE_TOKEN != '') }}
        run: |
          npm install -g firebase-tools
          if [ -f "firebase-service-account.json" ]; then
            export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/firebase-service-account.json
          fi

          COMMIT_MSG="${{ github.event.head_commit.message || 'Manual build triggered from GitHub Actions' }}"
          
          if [ -n "$FIREBASE_TOKEN" ]; then
            firebase appdistribution:distribute android/app/build/outputs/apk/release/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --groups "test" \
              --token "$FIREBASE_TOKEN" \
              --release-notes "$COMMIT_MSG"
          else
            firebase appdistribution:distribute android/app/build/outputs/apk/release/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --groups "test" \
              --release-notes "$COMMIT_MSG"
          fi
