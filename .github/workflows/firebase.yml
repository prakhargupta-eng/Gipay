name: Build & Upload to Firebase

on:
  push:
    branches:
      - main1
  workflow_dispatch:

jobs:
  build:
    name: Build & Distribute Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --ignore-engines

      - name: Setup Environment Variables
        run: |
          # Create .env file for react-native-config
          touch .env
          echo "ENV=production" >> .env
          echo "GOOGLE_MAPS_API_KEY=dummy_key_for_ci" >> .env

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 🔐 Firebase Auth — Handle raw JSON or Base64 service account
      - name: Setup Firebase Auth
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p "$HOME/.firebase"
          if echo "$SERVICE_ACCOUNT" | tr -d '\r\n' | base64 -d > /dev/null 2>&1 && [[ ! "$SERVICE_ACCOUNT" =~ "{" ]]; then
            echo "$SERVICE_ACCOUNT" | tr -d '\r\n' | base64 -d > "$HOME/firebase-service-account.json"
          else
            echo "$SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> $GITHUB_ENV

      # 🔐 Keystore Decoding & Signing Configuration
      - name: Setup Keystore & Signing Configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/app
          # 1. Decode keystore using Node.js (resilient to whitespace/linebreaks/quotes)
          node -e "
            const fs = require('fs');
            const raw = process.env.KEYSTORE_BASE64 || '';
            const clean = raw.replace(/['\"\r\n\s]/g, '');
            if (!clean) {
              console.error('❌ ERROR: KEYSTORE_BASE64 secret is empty or missing!');
              process.exit(1);
            }
            const buffer = Buffer.from(clean, 'base64');
            const preview = buffer.toString('utf8', 0, 50).trim();
            if (preview.startsWith('{') && preview.includes('\"')) {
              console.error('❌ ERROR: KEYSTORE_BASE64 decoded into JSON text data!');
              console.error('It appears the Firebase service account JSON was accidentally pasted into the KEYSTORE_BASE64 secret in GitHub.');
              console.error('Please update GitHub Secret KEYSTORE_BASE64 with the base64-encoded gigpay-release-key.keystore file.');
              process.exit(1);
            }
            fs.writeFileSync('android/app/gigpay-release-key.keystore', buffer);
            fs.writeFileSync('android/gigpay-release-key.keystore', buffer);
            console.log('Keystore written successfully (' + buffer.length + ' bytes)');
          "

          # 2. Sanitize credentials (remove quotes/newlines/trailing spaces)
          CLEAN_ALIAS=$(echo "$KEY_ALIAS" | tr -d '\r\n"' | xargs)
          CLEAN_STORE_PASS=$(echo "$KEYSTORE_PASS" | tr -d '\r\n"' | xargs)
          CLEAN_KEY_PASS=$(echo "$KEY_PASS" | tr -d '\r\n"' | xargs)

          # 3. Create android/key.properties (matches rootProject.file("key.properties") in android/app/build.gradle)
          printf "storeFile=gigpay-release-key.keystore\nkeyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n" \
            "$CLEAN_ALIAS" "$CLEAN_STORE_PASS" "$CLEAN_KEY_PASS" > android/key.properties

          # 4. Also export environment variables (matches System.getenv in android/app/build.gradle)
          echo "MYAPP_UPLOAD_STORE_FILE=gigpay-release-key.keystore" >> $GITHUB_ENV
          echo "MYAPP_UPLOAD_KEY_ALIAS=$CLEAN_ALIAS" >> $GITHUB_ENV
          echo "MYAPP_UPLOAD_STORE_PASSWORD=$CLEAN_STORE_PASS" >> $GITHUB_ENV
          echo "MYAPP_UPLOAD_KEY_PASSWORD=$CLEAN_KEY_PASS" >> $GITHUB_ENV

          # 5. Inspect and validate keystore file before build
          echo "Keystore file type:"
          file android/app/gigpay-release-key.keystore
          echo "Testing keystore with keytool..."
          keytool -list -keystore android/app/gigpay-release-key.keystore -storepass "$CLEAN_STORE_PASS" -alias "$CLEAN_ALIAS"

      # 📦 Build APK
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --stacktrace

      # 💾 Save APK as GitHub Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      # 🚀 Upload to Firebase App Distribution
      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in android/app/build/outputs/apk/release!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"

          COMMIT_MSG="${{ github.event.head_commit.message || 'Manual build triggered from GitHub Actions' }}"

          if [ -n "$FIREBASE_TOKEN" ] && [ ! -s "$HOME/firebase-service-account.json" ]; then
            firebase appdistribution:distribute "$APK_PATH" \
              --app "$FIREBASE_APP_ID" \
              --groups "test" \
              --token "$FIREBASE_TOKEN" \
              --release-notes "$COMMIT_MSG" \
              --debug
          else
            firebase appdistribution:distribute "$APK_PATH" \
              --app "$FIREBASE_APP_ID" \
              --groups "test" \
              --release-notes "$COMMIT_MSG" \
              --debug
          fi  