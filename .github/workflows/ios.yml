name: Build & Distribute iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      export_method:
        description: 'Export method (ad-hoc for Firebase, app-store for TestFlight)'
        required: false
        default: 'ad-hoc'
        type: choice
        options:
          - ad-hoc
          - app-store
          - development
          - enterprise

jobs:
  build-ios:
    name: Build & Distribute iOS App
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Node Dependencies
        run: yarn install --ignore-engines

      - name: Setup Environment Variables
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
          else
            touch .env
            echo "ENV=production" >> .env
            echo "GOOGLE_MAPS_API_KEY=dummy_key_for_ci" >> .env
          fi
          bundle exec ruby update_xcode.rb || ruby update_xcode.rb

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: ios
        run: |
          bundle exec pod install || pod install --repo-update

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 🔐 Firebase Auth — Handle raw JSON or Base64 service account (reused from Android)
      - name: Setup Firebase Auth
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p "$HOME/.firebase"
          if echo "$SERVICE_ACCOUNT" | tr -d '\r\n' | base64 -d > /dev/null 2>&1 && [[ ! "$SERVICE_ACCOUNT" =~ "{" ]]; then
            echo "$SERVICE_ACCOUNT" | tr -d '\r\n' | base64 -d > "$HOME/firebase-service-account.json"
          else
            echo "$SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> $GITHUB_ENV

      # 🔐 Configure Apple Keychain, Certificates & Provisioning Profile
      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 || secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD || secrets.P12_PASSWORD || secrets.IOS_KEYCHAIN_SECRET || '' }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 || secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD || secrets.KEYCHAIN_PASSWORD || secrets.IOS_KEYCHAIN_SECRET || 'gigpay_temporary_keychain_pass_123' }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "❌ ERROR: Secret IOS_BUILD_CERTIFICATE_BASE64 is missing!"
            exit 1
          fi
          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "❌ ERROR: Secret IOS_PROVISION_PROFILE_BASE64 is missing!"
            exit 1
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # 1. Decode certificate (supports gzipped or plain base64)
          if echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode | gzip -t >/dev/null 2>&1; then
            echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode | gzip -d > "$CERTIFICATE_PATH"
          else
            echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode > "$CERTIFICATE_PATH"
          fi

          # Decode provisioning profile (supports gzipped or plain base64)
          if echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode | gzip -t >/dev/null 2>&1; then
            echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode | gzip -d > "$PP_PATH"
          else
            echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode > "$PP_PATH"
          fi

          # 2. Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 3. Import certificate to keychain
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # 4. Extract Provisioning Profile details using PlistBuddy
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i "$PP_PATH"))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< $(security cms -D -i "$PP_PATH"))
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /dev/stdin <<< $(security cms -D -i "$PP_PATH"))
          
          # Detect method: development (if get-task-allow=true), ad-hoc (if devices present), or app-store
          GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' /dev/stdin <<< $(security cms -D -i "$PP_PATH") 2>/dev/null || echo "false")
          if [ "$GET_TASK_ALLOW" = "true" ]; then
            DETECTED_METHOD="development"
          elif /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' /dev/stdin <<< $(security cms -D -i "$PP_PATH") > /dev/null 2>&1; then
            DETECTED_METHOD="ad-hoc"
          else
            DETECTED_METHOD="app-store"
          fi
          EXPORT_METHOD="${{ github.event.inputs.export_method || '' }}"
          if [ -z "$EXPORT_METHOD" ]; then
            EXPORT_METHOD="$DETECTED_METHOD"
          fi

          # Detect if profile is Xcode managed
          IS_XCODE_MANAGED=$(/usr/libexec/PlistBuddy -c 'Print :IsXcodeManaged' /dev/stdin <<< $(security cms -D -i "$PP_PATH") 2>/dev/null || echo "false")

          echo "Detected Profile UUID: $PROFILE_UUID"
          echo "Detected Profile Name: $PROFILE_NAME"
          echo "Detected Team ID: $TEAM_ID"
          echo "Detected IsXcodeManaged: $IS_XCODE_MANAGED"
          echo "Selected Export Method: $EXPORT_METHOD"

          # 5. Install Provisioning Profile to system directory
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_NAME.mobileprovision" 2>/dev/null || true

          # 6. Extract exact signing identity from keychain
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -o '".*"' | tr -d '"' | head -n 1)
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "❌ ERROR: No valid code signing identity found in certificate!"
            exit 1
          fi
          echo "Found Signing Identity: $SIGNING_IDENTITY"

          # Export shell variables to process.env for Node.js and subsequent workflow steps
          export PROFILE_UUID
          export PROFILE_NAME
          export TEAM_ID
          export IS_XCODE_MANAGED
          export EXPORT_METHOD
          export SIGNING_IDENTITY
          export KEYCHAIN_PATH

          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "IS_XCODE_MANAGED=$IS_XCODE_MANAGED" >> $GITHUB_ENV
          echo "EXPORT_METHOD=$EXPORT_METHOD" >> $GITHUB_ENV
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          # 7. Create ExportOptions.plist using Node.js
          mkdir -p "$RUNNER_TEMP/export"
          node -e '
            const fs = require("fs");
            let method = process.env.EXPORT_METHOD || "development";
            // Map to Xcode 16 supported values: app-store-connect, release-testing, enterprise, debugging
            if (method === "ad-hoc") method = "release-testing";
            else if (method === "development") method = "debugging";
            else if (method === "app-store") method = "app-store-connect";

            const isManaged = process.env.IS_XCODE_MANAGED === "true";
            const signingStyle = isManaged ? "automatic" : "manual";
            const lines = [
              "<?xml version=\"1.0\" encoding=\"UTF-8\"?>",
              "<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">",
              "<plist version=\"1.0\">",
              "<dict>",
              "    <key>method</key>",
              `    <string>${method}</string>`,
              "    <key>teamID</key>",
              `    <string>${process.env.TEAM_ID}</string>`,
              "    <key>signingStyle</key>",
              `    <string>${signingStyle}</string>`
            ];

            if (!isManaged) {
              lines.push(
                "    <key>provisioningProfiles</key>",
                "    <dict>",
                "        <key>com.octal.james.gigPay</key>",
                `        <string>${process.env.PROFILE_UUID}</string>`,
                "    </dict>"
              );
            }

            lines.push(
              "    <key>destination</key>",
              "    <string>export</string>",
              "    <key>compileBitcode</key>",
              "    <false/>",
              "    <key>stripSwiftSymbols</key>",
              "    <true/>",
              "</dict>",
              "</plist>"
            );
            fs.writeFileSync(process.env.RUNNER_TEMP + "/ExportOptions.plist", lines.join("\n"));
            console.log("ExportOptions.plist created successfully with method: " + method);
          '
          cat "$RUNNER_TEMP/ExportOptions.plist"

      # 🛡️ Prevent CocoaPods Frameworks from inheriting provisioning profiles
      - name: Disable Signing for CocoaPods Frameworks
        run: |
          bundle exec ruby -e "
            require 'xcodeproj'
            if File.exist?('ios/Pods/Pods.xcodeproj')
              pods_project = Xcodeproj::Project.open('ios/Pods/Pods.xcodeproj')
              pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
                end
              end
              pods_project.save
              puts 'Successfully disabled code signing on CocoaPods framework targets'
            end
          " || echo "Warning: Pods.xcodeproj not modified"

      # 📦 Build Archive
      - name: Build Archive (xcodebuild archive)
        run: |
          mkdir -p build
          if [ "$IS_XCODE_MANAGED" = "true" ]; then
            echo "Profile is Xcode-managed. Archiving with Automatic signing..."
            xcodebuild archive \
              -workspace ios/GigPay.xcworkspace \
              -scheme GigPay \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/GigPay.xcarchive" \
              -destination "generic/platform=iOS" \
              DEVELOPMENT_TEAM="$TEAM_ID"
          else
            echo "Profile is manually managed. Archiving with Manual signing..."
            xcodebuild archive \
              -workspace ios/GigPay.xcworkspace \
              -scheme GigPay \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/GigPay.xcarchive" \
              -destination "generic/platform=iOS" \
              CODE_SIGN_STYLE="Manual" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
              CODE_SIGN_IDENTITY="$SIGNING_IDENTITY"
          fi

      # 📦 Export IPA
      - name: Export IPA (xcodebuild -exportArchive)
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GigPay.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates

          mkdir -p ios/build/outputs/ipa
          cp "$RUNNER_TEMP/export/"*.ipa ios/build/outputs/ipa/GigPay.ipa
          echo "Generated IPA successfully at: ios/build/outputs/ipa/GigPay.ipa"
          ls -lh ios/build/outputs/ipa/

      # 💾 Save IPA as GitHub Artifact
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GigPay-iOS-Release-IPA
          path: ios/build/outputs/ipa/*.ipa
          retention-days: 7

      # 🚀 Upload to Firebase App Distribution
      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          IPA_PATH=$(find ios/build/outputs/ipa "$RUNNER_TEMP/export" -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ ERROR: No IPA file found to distribute!"
            exit 1
          fi
          echo "Found IPA at: $IPA_PATH ($(ls -lh "$IPA_PATH" | awk '{print $5}'))"

          # 1. Resolve Firebase iOS App ID (prefer GoogleService-Info.plist if secret is invalid or has wrong format)
          PLIST_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' ios/GoogleService-Info.plist 2>/dev/null || echo "")
          CLEAN_SECRET_APP_ID=$(echo "$FIREBASE_APP_ID" | tr -d '\r\n"' | xargs)

          if [[ "$CLEAN_SECRET_APP_ID" =~ ^1:[0-9]+:ios:[a-f0-9]+$ ]]; then
            TARGET_APP_ID="$CLEAN_SECRET_APP_ID"
          elif [ -n "$PLIST_APP_ID" ]; then
            TARGET_APP_ID="$PLIST_APP_ID"
          else
            TARGET_APP_ID="1:638019750272:ios:455b523796f0fd35fb1965"
          fi

          echo "Target Firebase iOS App ID: $TARGET_APP_ID"

          COMMIT_MSG="${{ github.event.head_commit.message || 'Manual iOS build triggered from GitHub Actions' }}"

          echo "Distributing to Firebase App Distribution group: test..."
          if [ -s "$HOME/firebase-service-account.json" ]; then
            echo "Authenticating using Firebase Service Account JSON..."
            firebase appdistribution:distribute "$IPA_PATH" \
              --app "$TARGET_APP_ID" \
              --groups "test" \
              --release-notes "$COMMIT_MSG" \
              --debug
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Authenticating using Firebase Token..."
            firebase appdistribution:distribute "$IPA_PATH" \
              --app "$TARGET_APP_ID" \
              --groups "test" \
              --token "$FIREBASE_TOKEN" \
              --release-notes "$COMMIT_MSG" \
              --debug
          else
            echo "Authenticating using default environment credentials..."
            firebase appdistribution:distribute "$IPA_PATH" \
              --app "$TARGET_APP_ID" \
              --groups "test" \
              --release-notes "$COMMIT_MSG" \
              --debug
          fi
          echo "🎉 Successfully uploaded and distributed iOS IPA to Firebase!"

      # 🧹 Cleanup Keychain and Profiles
      - name: Clean up Keychain and Provisioning Profiles
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null || true
          rm -f "$HOME/firebase-service-account.json" 2>/dev/null || true
